[project]
name = "halotec-container-ocr-desktop"
version = "1.9.0"
description = "Windows Desktop application for drone video container detection, panorama stitching, and ISO 6346 OCR."
readme = "README.md"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".venv*",
    "dist",
    "build*",
    "outputs",
    "scripts",
    "container-detection-drone-view",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv*",
    "dist",
    "build*",
    "outputs",
    "container-detection-drone-view",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src", "main.py"]
